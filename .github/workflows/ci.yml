name: ci

on:
  push:
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  fixtures:
    # The brownfield fixture and greenfield template must themselves compile under the strict config.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [fixtures/brownfield-users, templates/greenfield]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - if: matrix.dir == 'fixtures/brownfield-users'
        run: npm test
